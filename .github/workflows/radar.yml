name: Radar continuo

# Public repository: GitHub Actions minutes are free, so the radar runs
# continuously in slices of up to ~5.7 h (a job may last at most 6 h):
#   - full scan every 5 min in session, every 10 min pre/after hours
#   - fast watch (ARRANQUE) every 90 s for ALTA/MAXIMA tickers
# GitHub often delays or drops scheduled triggers, so they fire every 30 min:
# only one slice runs at a time (concurrency) and a pending one starts as soon
# as the current one ends. Outside market hours a slice exits in ~1 minute.
on:
  schedule:
    - cron: "*/30 * * * 1-5"
  workflow_dispatch: {}   # manual "Run workflow" button

concurrency:
  group: radar
  cancel-in-progress: false

permissions:
  contents: write   # to save the database in the radar-data branch

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Restore history (radar-data branch)
        run: |
          mkdir -p data
          if git ls-remote --exit-code --heads origin radar-data >/dev/null; then
            git fetch --depth 1 origin radar-data
            git show origin/radar-data:radar.db > data/radar.db
          fi

      - name: Radar
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m radar run --max-minutes 340 --exit-when-closed

      - name: Save history
        if: always()
        run: |
          [ -f data/radar.db ] || exit 0
          python -c "import sqlite3; c=sqlite3.connect('data/radar.db'); c.execute('PRAGMA wal_checkpoint(TRUNCATE)'); c.close()"
          tmp=$(mktemp -d)
          cp data/radar.db "$tmp/radar.db"
          cd "$tmp"
          git init -q -b radar-data
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add radar.db
          git commit -q -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" radar-data
