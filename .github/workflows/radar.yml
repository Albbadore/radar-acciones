name: Radar continuo

# Public repository: GitHub Actions minutes are free, so the radar runs
# continuously in slices of up to ~5.7 h (a job may last at most 6 h):
#   - full scan every 5 min in session, every 10 min pre/after hours
#   - fast watch (ARRANQUE) every 90 s for ALTA/MAXIMA tickers
# GitHub often delays or drops scheduled triggers, so they fire every 30 min:
# only one slice runs at a time (concurrency) and a pending one starts as soon
# as the current one ends. Outside market hours a slice exits in ~1 minute.
#
# History: data/radar.db is stored gzip-compressed in the radar-data branch
# (GitHub rejects files > 100 MB), every 45 min and at the end of each slice.
on:
  schedule:
    - cron: "*/30 * * * 1-5"
  workflow_dispatch: {}   # manual "Run workflow" button

concurrency:
  group: radar
  cancel-in-progress: false

permissions:
  contents: write   # to save the database in the radar-data branch

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Restore history (radar-data branch)
        run: |
          mkdir -p data
          if git ls-remote --exit-code --heads origin radar-data >/dev/null; then
            git fetch --depth 1 origin radar-data
            if git cat-file -e origin/radar-data:radar.db.gz 2>/dev/null; then
              git show origin/radar-data:radar.db.gz | gunzip > data/radar.db
            else
              git show origin/radar-data:radar.db > data/radar.db   # legacy, uncompressed
            fi
          fi

      - name: Radar
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Intermediate saves so a failure never loses a whole slice.
          ( while sleep 2700; do bash .github/scripts/save_history.sh || echo "Guardado intermedio fallido"; done ) &
          saver=$!
          status=0
          python -m radar run --max-minutes 340 --exit-when-closed || status=$?
          kill "$saver" 2>/dev/null || true
          exit "$status"

      - name: Save history
        if: always()
        run: bash .github/scripts/save_history.sh
