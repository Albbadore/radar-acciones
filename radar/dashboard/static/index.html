<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radar especulativo</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --text: #1b1f24; --muted: #5d6673; --line: #dfe3e8;
  --max: #d62828; --alta: #f77f00; --vig: #e9b500; --ok: #2a9d8f; --warn-bg: #fff4d6;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #111418; --panel: #1a1e24; --text: #e6e9ed; --muted: #9aa4b1; --line: #2c323a;
          --warn-bg: #3a3014; }
}
* { box-sizing: border-box; }
body { margin: 0; font: 14px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
       background: var(--bg); color: var(--text); }
header { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 16px;
         align-items: baseline; flex-wrap: wrap; }
header h1 { font-size: 18px; margin: 0; }
header .meta { color: var(--muted); font-size: 12px; }
nav button { background: none; border: 1px solid var(--line); color: var(--text); padding: 6px 12px;
             border-radius: 6px; cursor: pointer; }
nav button.on { background: var(--text); color: var(--bg); }
main { padding: 12px 16px 40px; max-width: 1500px; margin: 0 auto; }
.filters { display: flex; flex-wrap: wrap; gap: 8px 14px; margin: 8px 0 14px; }
.filters label { display: flex; gap: 5px; align-items: center; cursor: pointer; }
.disclaimer { color: var(--muted); font-size: 12px; margin: 4px 0 12px; }
h2 { font-size: 15px; margin: 18px 0 6px; display: flex; gap: 8px; align-items: center; }
h2 .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
.table-wrap { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 6px 9px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
th { font-size: 12px; color: var(--muted); font-weight: 600; background: var(--panel); position: sticky; top: 0; }
td.l, th.l { text-align: left; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: color-mix(in srgb, var(--text) 6%, transparent); }
.score { font-weight: 700; }
.pos { color: var(--ok); } .neg { color: var(--max); }
.flag { background: var(--warn-bg); border-radius: 4px; padding: 0 4px; font-size: 11px; }
.empty { color: var(--muted); padding: 10px; }
#detail { position: fixed; inset: 0 0 0 auto; width: min(620px, 100%); background: var(--panel);
          border-left: 1px solid var(--line); overflow-y: auto; padding: 16px; display: none;
          box-shadow: -8px 0 24px rgba(0,0,0,.15); }
#detail.open { display: block; }
#detail h3 { margin: 0 0 4px; }
#detail .close { float: right; }
.kv { display: grid; grid-template-columns: 190px 1fr; gap: 4px 10px; font-size: 13px; }
.kv div:nth-child(odd) { color: var(--muted); }
.src { color: var(--muted); font-size: 11px; }
.bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--alta); }
ul.cats { padding-left: 18px; margin: 4px 0; }
a { color: inherit; }
</style>
</head>
<body>
<header>
  <h1>Radar de coincidencia de señales</h1>
  <span class="meta" id="meta">cargando...</span>
  <nav>
    <button data-tab="now" class="on">Destacadas</button>
    <button data-tab="alerts">Histórico de alertas</button>
    <button data-tab="stats">¿Funcionan las señales?</button>
  </nav>
</header>
<main>
  <p class="disclaimer">Los niveles indican únicamente coincidencia de señales. No constituyen una recomendación de compra.</p>

  <section id="tab-now">
    <div class="filters" id="filters">
      <label><input type="checkbox" data-f="p1"> Precio &lt; $1</label>
      <label><input type="checkbox" data-f="p5"> Precio $1–5</label>
      <label><input type="checkbox" data-f="p20"> Precio $5–20</label>
      <label><input type="checkbox" data-f="f1"> Float &lt; 1M</label>
      <label><input type="checkbox" data-f="f5"> Float &lt; 5M</label>
      <label><input type="checkbox" data-f="rs"> Reverse split reciente</label>
      <label><input type="checkbox" data-f="v5"> Volumen &gt; 5x</label>
      <label><input type="checkbox" data-f="pm"> Premarket</label>
      <label><input type="checkbox" data-f="all"> Mostrar también SIN ALERTA</label>
    </div>
    <div id="groups"></div>
  </section>

  <section id="tab-alerts" hidden>
    <div class="table-wrap"><table id="alerts-table"></table></div>
  </section>

  <section id="tab-stats" hidden>
    <div class="filters">
      <label>Umbral de acierto (subida máxima ≥)
        <input type="number" id="hit" value="20" min="1" max="1000" style="width:70px"> %</label>
    </div>
    <div id="stats"></div>
  </section>
</main>
<aside id="detail"></aside>
<script src="/app.js"></script>
</body>
</html>
